<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Reserva de Vuelo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-container {
            max-width: 500px;
            margin: auto;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: block;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Reserva de Vuelo</h2>
    <form th:action="@{/reserve/evaluate}" th:object="${reserveRequest}" method="post">
        <h3>Datos del Pasajero</h3>

        <label for="name">Nombre:</label>
        <input type="text" id="name" th:field="${reserveRequest.passenger.name}">
        <span class="error" th:errors="${reserveRequest.passenger.name}"></span>

        <label for="age">Edad:</label>
        <input type="number" id="age" th:field="${reserveRequest.passenger.age}">
        <span class="error" th:errors="${reserveRequest.passenger.age}"></span>

        <label for="flightDuration">Duración del vuelo (horas):</label>
        <input type="number" id="flightDuration" th:field="${reserveRequest.flightDuration}">
        <span class="error" th:errors="${reserveRequest.flightDuration}"></span>

        <label for="durationFlight">Retraso de vuelo (min):</label>
        <input type="number" id="durationFlight" th:field="${reserveRequest.flightDelay}">
        <span class="error" th:errors="${reserveRequest.flightDelay}"></span>

        <label for="weightlubbage">Peso Equipaje:</label>
        <input type="number" id="weightlubbage" th:field="${reserveRequest.weightlubbage}">
        <span class="error" th:errors="${reserveRequest.weightlubbage}"></span>

        <label for="children">Viajas con niños:</label>
        <select id="children" th:field="${reserveRequest.children}">
            <option value="">Seleccione</option>
            <option value="yes">Si</option>
            <option value="no">No</option>
        </select>
        <span class="error" th:errors="${reserveRequest.children}"></span>

        <label for="preferences">Preferencia Asiento: </label>
        <select id="preferences" th:field="${reserveRequest.passenger.preferences}">
            <option value="">Seleccione</option>
            <option value="any">Any</option>
            <option value="emergency">Emergencia
            <option value="normal">Normal</option>
            <option value="family">Familiar</option>


        </select>
        <span class="error" th:errors="${reserveRequest.passenger.preferences}"></span>

        <label for="classFlight">Status:</label>
        <select id="classFlight" th:field="${reserveRequest.classFlight}">
            <option value="">Seleccione</option>
            <option value="economico">Económico</option>
            <option value="premium">Premium</option>
            <option value="ejecutiva">Ejecutiva</option>
        </select>
        <span class="error" th:errors="${reserveRequest.status}"></span>

        <label for="status">Membresia:</label>
        <select id="status" th:field="${reserveRequest.status}">
            <option value="">Seleccione</option>
            <option value="basic">Basic</option>
            <option value="gold">Gold</option>
            <option value="platinum">Platinum</option>
        </select>
        <span class="error" th:errors="${reserveRequest.status}"></span>

        <button type="submit">Enviar</button>
    </form>
</div>
</body>
</html>
